name: Verify current database API design
on:
  push:
    branches: [main, task/DB-Rename-01-linux, DB-DotNet-01]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  api-interface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate .NET migration and unchanged historical contracts
        run: python3 tools/verify_db_dotnet.py --verify-frozen-history
