name: Verify current database API design
on:
  push:
    branches: [main, task/DB-Scope-01-linux]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  api-interface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate current scope, package closure, links, exact archived bytes and current whitespace
        run: python3 tools/verify_db_scope.py
